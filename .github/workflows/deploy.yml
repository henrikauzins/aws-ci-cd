name: deploy
 
on:
  push:
    branches: [main]
 
permissions:
  id-token: write
  contents: read
 
env:
  AWS_REGION: eu-west-2
  CLUSTER: hello-eks-cluster
  ECR_REPO: hello-eks-repo
 
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - name: Run tests
        run: |
          pip install -r requirements.txt pytest
          pytest -q
 
       - name: Show OIDC claims
         run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com"
          req = urllib.request.Request(url, headers={"Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          tok = json.load(urllib.request.urlopen(req))["value"]
          body = tok.split(".")[1]
          body += "=" * (-len(body) % 4)
          claims = json.loads(base64.urlsafe_b64decode(body))
          print(json.dumps({k: claims.get(k) for k in ["sub", "aud", "iss", "repository", "repository_owner", "ref"]}, indent=2))
          PY

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
 
      - name: Who am I
        run: aws sts get-caller-identity
 
      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
 
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
 
      - name: Build and push
        run: |
          REPO=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t $REPO:${{ github.sha }} -t $REPO:latest --push .
 
      - name: Get kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.CLUSTER }} --region ${{ env.AWS_REGION }}
 
      - name: Deploy
        run: |
          REPO=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}
          kubectl apply -f k8s/
          kubectl set image deployment/hello web=$REPO:${{ github.sha }}
          kubectl rollout status deployment/hello --timeout=180s

